name: Milo CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: yarn
      - name: Use Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn type-check
      - name: Milo tests (no API credentials needed)
        run: yarn test
      - name: Build Chrome MV3 and ZIP
        run: |
          yarn build
          yarn package
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: milo-chrome-extension
          path: dist/Milo-Browser-Extension-*.zip
          if-no-files-found: error
